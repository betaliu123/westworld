<script>/* The loading stroke before the game runs: each script file that arrives moves it toward 60% (how many there are is not known here). src/boot-progress.js takes it from there. */(()=>{const bar=document.getElementById('boot');let files=0;try{new PerformanceObserver(list=>{files+=list.getEntries().filter(e=>/\.m?js(\?|$)/.test(e.name)).length;if(bar.dataset.phase)return;const p=.6*(1-Math.exp(-files/70));bar.style.setProperty('--p',p);bar.setAttribute('aria-valuenow',Math.round(p*100));}).observe({type:'resource',buffered:true});}catch{}})();</script>
