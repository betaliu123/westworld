<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>势力关系图布局验收</title><body style="background:#102c28;color:#efdeb2;font:16px sans-serif"><h1>势力关系图布局验收</h1><p>采用正式样式与正式情报渲染，验证三个目标视口的面板边界、关闭按钮及 HUD 避让。</p><div id="results"></div><script type="module">
import {Simulation,newArrival} from '../src/simulation.js';
import {learn,organizationHTML} from '../src/factions.js';
const sim=new Simulation(newArrival());for(const id of ['watch','tax','ledger','patron','apex'])learn(sim,id,'布局验收');
for(const [w,h] of [[1280,850],[1024,768],[800,600]]){const frame=document.createElement('iframe');frame.width=w;frame.height=h;frame.style='display:block;margin:20px 0;border:1px solid #887';const label=document.createElement('p');label.textContent=`${w} × ${h} · 检查中`;document.querySelector('#results').append(label,frame);frame.onload=()=>{requestAnimationFrame(()=>{const doc=frame.contentDocument,panel=doc.querySelector('#drawer'),close=doc.querySelector('button'),a=panel.getBoundingClientRect(),b=close.getBoundingClientRect();const ok=a.left>=0&&a.right<=w&&a.top>=0&&a.bottom<=h&&b.top>=a.top&&b.bottom<=a.bottom&&doc.defaultView.getComputedStyle(doc.querySelector('#hud-left-stack')).visibility==='hidden'&&panel.scrollHeight>panel.clientHeight;label.textContent=`${w} × ${h} · ${ok?'PASS':'FAIL'} · 面板可滚动、关闭可见、HUD 避让`;label.dataset.passed=String(ok);});};frame.srcdoc=`<!doctype html><html lang="zh-CN"><link rel="stylesheet" href="/style.css"><body class="panel-open"><header id="hud">角色信息与快捷图标</header><div id="hud-left-stack">角色 / 任务 / 长日志</div><div id="minimap">地图</div><div id="environment-tools">行囊</div><aside id="drawer" data-view="organization"><header>临溪 · 随身记事<button aria-label="关闭记录">×</button></header><h2>势力与线索</h2>${organizationHTML(sim,x=>x)}</aside></body></html>`;}
</script></body></html>
