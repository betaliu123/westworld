<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../ink-ui.css"><style>body{margin:0;background:#ece3cf}canvas{display:block}nav{position:fixed;top:14px;left:14px;display:flex;gap:8px;font:16px KaiTi,serif}button,select{font:inherit}</style><nav><select aria-label="人物"><option value="bookseller">温素笺</option><option value="merchant">许行商</option><option value="chi">段赤川</option><option value="traveler">锦衣客</option><option value="inspector">顾钦差</option><option value="hero">主角</option></select><button>睁眼 / 闭眼</button><output></output></nav><script type="module">
import * as T from '../vendor/three.module.js';
import {character} from '../src/world.js';import {mountHeroModel} from '../src/hero-model.js';import {mountActorModel,npcLook} from '../src/actor-model.js';
const scene=new T.Scene(),camera=new T.PerspectiveCamera(30,innerWidth/innerHeight,.01,10),renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);scene.background=new T.Color(0xece3cf);scene.add(new T.HemisphereLight(0xece3cf,0x4f4b42,2));const sun=new T.DirectionalLight(0xece3cf,2);sun.position.set(-2,3,4);scene.add(sun);let actor,model,closed=true,hero=false;
function select(id){if(actor)scene.remove(actor);actor=character(0x657f89,false,id==='bookseller');scene.add(actor);hero=id==='hero';model=hero?mountHeroModel(actor,'../src/models/hero.glb'):mountActorModel(actor,npcLook(id));const y={bookseller:1.69,merchant:1.8,chi:1.73,traveler:1.83,inspector:1.56,hero:1.8}[id];camera.position.set(0,y,.85);camera.lookAt(0,y,0);}
select('bookseller');document.querySelector('select').onchange=e=>select(e.target.value);document.querySelector('button').onclick=()=>closed=!closed;
function frame(){requestAnimationFrame(frame);const state={hatOn:false,dt:.016,hp:100,fallback:true,bedPose:closed?{weight:1}:null};hero?model.sync(state):model.sync(0x657f89,state);document.querySelector('output').textContent=closed?'闭眼':'睁眼';renderer.render(scene,camera);}frame();
</script>
