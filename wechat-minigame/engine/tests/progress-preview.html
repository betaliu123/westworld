<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>任务与势力界面验收（不读写存档）</title><style>body{background:#38483d;color:white;font:14px sans-serif}iframe{border:2px solid #bba77c;display:block;margin:20px 0}button{padding:12px}</style><h1>任务与势力界面验收 · 不读写存档</h1><button id="org">势力图</button><button id="quest">任务</button><button id="prison">被捕反馈</button><pre id="reports"></pre><div id="frames"></div><script>for(const [w,h]of [[1280,850],[1024,768],[800,600]]){const f=document.createElement('iframe');f.width=w;f.height=h;f.src='progress-frame.html';document.getElementById('frames').append(f)}for(const id of ['org','quest','prison'])document.getElementById(id).onclick=()=>document.querySelectorAll('iframe').forEach(f=>f.contentWindow.postMessage(id,location.origin));const results={};window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data.report){results[e.data.width]=e.data;document.getElementById('reports').textContent=JSON.stringify(results,null,2);}});</script></html>
