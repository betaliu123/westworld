<!doctype html><meta charset="utf-8"><style>body{margin:0;overflow:hidden}canvas{width:100vw;height:100vh}output{position:fixed;top:10px;left:10px;background:#163c35;color:#ffe0a3;padding:10px}</style><canvas></canvas><output>灌木与路线验收</output><script>window.addEventListener("error",e=>document.querySelector("output").textContent=e.message);</script><script type="module">
import {Simulation,newArrival} from '../src/simulation.js';import {World} from '../src/world.js';import {Ecosystem} from '../src/ecosystem.js';import {lifeStep,consumeFood} from '../src/npc-life.js';import {routinePath} from '../src/npc-navigation.js';
const sim=new Simulation(newArrival());sim.save=()=>{};const w=new World(document.querySelector('canvas'),sim),eco=new Ecosystem(sim,w.environmentAssets);w.playing=true;w.hero.position.set(20,0,32);sim.s.player.x=20;sim.s.player.z=32;w.distance=12;w.yaw=.4;const positions=Object.fromEntries([...w.npcs].map(([id,n])=>[id,{x:n.actor.position.x,z:n.actor.position.z}]));let passed=0,report=[];for(const id of ['traveler','gate_merchant']){consumeFood(sim.s.people[id],{type:'food',hp:30,poisoned:true,location:'npc:'+id},0);}lifeStep(sim,eco,1,positions);for(const id of ['traveler','gate_merchant']){const goal=sim.s.people[id].life.target;const route=routinePath(positions[id],goal,(x,z)=>w.collides(x,z,0,false),.35);if(route?.length)passed++;report.push(id+':'+route.length);}document.querySelector('output').textContent='锦衣客 / 赵行商 灌木路径：'+passed+'/2 可达 '+report.join(' / ');let prev=performance.now();function frame(now){w.camera.position.set(13,14,43);w.camera.lookAt(19,0,28);w.renderer.render(w.scene,w.camera);prev=now;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script>
