<!doctype html><meta charset="utf-8"><style>body{margin:0}nav{position:fixed;top:12px;left:12px;display:flex;gap:8px;flex-wrap:wrap}button,output{padding:9px;background:#183f36;color:#f6dca1;border:1px solid #c8b676}</style><canvas></canvas><nav><button id="hurt">受击</button><button id="die">倒地</button><button id="revive">复苏</button><button id="draw">拔刀 / 收刀</button><button id="jump">跳跃</button><output></output></nav><script type="module">
import {Simulation,newGame} from '../src/simulation.js';import {World} from '../src/world.js';const sim=new Simulation(newGame());sim.save=()=>{};const w=new World(document.querySelector('canvas'),sim);w.playing=true;w.hero.position.set(-5,0,31);sim.s.player.x=-5;sim.s.player.z=31;w.yaw=.3;w.distance=8;w.onLifeSpeech=line=>document.querySelector('output').textContent=line.text;w.onHurt=()=>{};
document.querySelector('#hurt').onclick=()=>sim.s.player.hp=Math.max(0,sim.s.player.hp-10);document.querySelector('#die').onclick=()=>sim.s.player.hp=0;document.querySelector('#revive').onclick=()=>sim.s.player.hp=100;document.querySelector('#draw').onclick=()=>w.toggleWeapon();document.querySelector('#jump').onclick=()=>{w.jump();document.querySelector('output').textContent='气血 '+sim.s.player.hp+' / 跳跃速度 '+w.jumpV;};let prev=performance.now();function frame(now){w.update(Math.min(.04,(now-prev)/1000));prev=now;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script>
