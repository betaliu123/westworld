<!doctype html><html lang="zh-CN"><meta charset="utf-8"><link rel="stylesheet" href="../style.css"><body><div id="hud"><div class="top-actions"><span id="clock">第 4 日</span></div></div><div id="minimap"><canvas width="164" height="164"></canvas></div><div id="toast"></div><div id="vitals">少侠</div><div id="ambient">茶棚的长对白不会与属性重叠。</div><div id="stealth-mode"></div><button id="interact">交互</button><aside id="drawer" hidden></aside><script src="../vendor/lucide.min.js"></script><script type="module">
import {mountHudLayout} from '../src/hud-layout.js';import {mountProgressUI} from '../src/progress-ui.js';import {Simulation,newArrival} from '../src/simulation.js';import {questsHTML} from '../src/progress.js';import {organizationHTML,learn} from '../src/factions.js';import {detainAtGate} from '../src/gate-scene.js';
const sim=new Simulation(newArrival());sim.s.facts.taxLedgerLead=true;learn(sim,'ledger','旧账房');learn(sim,'watch','茶棚旁听');mountHudLayout();const ui=mountProgressUI(()=>sim,s=>String(s),()=>show('quest'));const drawer=document.getElementById('drawer');function show(type){drawer.hidden=type==='prison';if(type==='prison'){detainAtGate(sim);return}drawer.dataset.view=type==='org'?'organization':'quests';drawer.innerHTML='<header>界面验收<button id="close">关闭</button></header><h2>'+ (type==='org'?'势力人物':'任务与线索')+'</h2>'+(type==='org'?organizationHTML(sim,s=>s):questsHTML(sim.s,s=>s));document.getElementById('close').onclick=()=>drawer.hidden=true;}
window.addEventListener('message',e=>{if(e.origin===location.origin)show(e.data)});setInterval(()=>{ui.update(true);const a=document.getElementById('hud-right-stack').getBoundingClientRect(),b=drawer.getBoundingClientRect(),close=document.getElementById('close')?.getBoundingClientRect();parent.postMessage({report:true,width:innerWidth,height:innerHeight,overlap:!drawer.hidden&&a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top,closeVisible:drawer.hidden||!!close&&close.top>=0&&close.bottom<=innerHeight,feedback:document.getElementById('attribute-change').innerText},location.origin);},100);show('org');</script></body></html>
