<!doctype html><meta charset="utf-8"><style>body{margin:0;overflow:hidden}canvas{width:100vw;height:100vh}nav{position:fixed;top:10px;left:10px;background:#183b33;color:#ffe0a0;padding:12px}button{padding:10px}</style><canvas></canvas><nav><button id="pay">锦衣客付茶钱</button><button id="collect">掌柜前来收钱</button><output></output></nav><script type="module">
import {Simulation,newArrival} from '../src/simulation.js';import {World} from '../src/world.js';import {Ecosystem} from '../src/ecosystem.js';import {princeStep} from '../src/prince.js';import {collectPayments} from '../src/cash-transfers.js';import {paymentMesh} from '../src/cash-model.js';import {routinePath} from '../src/npc-navigation.js';const sim=new Simulation(newArrival()),w=new World(document.querySelector('canvas'),sim),eco=new Ecosystem(sim,w.environmentAssets);sim.save=()=>{};eco.obstacles=w.obstacles;w.hero.position.set(-5,0,33);w.camera.position.set(-1,6,38);w.camera.lookAt(-6,1,29);let cash,model,walking=false,route=[];sim.listeners.push((type,data)=>{if(type==='npcCheck')w.showNpcCheck(data);});document.querySelector('#pay').onclick=()=>{sim.s.facts.princeDeparture??={stage:0};princeStep(sim,eco,{traveler:w.npcs.get('traveler').actor.position});cash=eco.s.items.find(i=>i.type==='coins');if(cash&&!model){model=paymentMesh(cash.amount);model.position.set(cash.x,cash.y,cash.z);w.scene.add(model);}document.querySelector('output').textContent='桌上 '+(cash?.amount||0)+' 文；掌柜尚未收款';};document.querySelector('#collect').onclick=()=>{if(!cash)return;eco.s.time=Math.max(eco.s.time,7);route=routinePath(w.npcs.get('tea_host').actor.position,cash.stand,(x,z)=>w.collides(x,z,0,false),.35);walking=true;document.querySelector('output').textContent='收钱路径 '+route.length+' 个节点';};let prev=performance.now();function frame(now){const dt=Math.min(.05,(now-prev)/1000);prev=now;w.t+=dt;if(walking){eco.s.time+=dt;const actor=w.npcs.get('tea_host').actor,q=route[0];if(q){const dx=q.x-actor.position.x,dz=q.z-actor.position.z,d=Math.hypot(dx,dz);if(d<.15)route.shift();else{actor.rotation.y=Math.atan2(dx,dz);w.move(actor,dx/d*1.35*dt,dz/d*1.35*dt);w.animateActor(actor,1,dt);}}collectPayments(sim,eco,{tea_host:actor.position});if(sim.s.people.tea_host.collectUntil>eco.s.time)actor.userData.arms[1].rotation.x=-1.4;if(cash.location==='collected'){model.visible=false;document.querySelector('output').textContent='已收 '+cash.amount+' 文；掌柜钱袋 '+sim.s.people.tea_host.purse+' 文';walking=false;}}w.updateNpcChecks();w.renderer.render(w.scene,w.camera);requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script>
